# TrailSnap 测试用 docker compose 栈（CI 与本地 -Mode docker 共用）。
# 端口由 tests/.env.test 的 TS_DOCKER_* 变量驱动（--env-file 注入）；
# 容器内部互联（postgres:5432 / ai:8001）静态写死，属 compose 职责。
#
# 镜像统一引用 :master；CI 在 .github/workflows/tests.yml 里 sed 替换成本地 build 的 :ci。
# 启动：tests/scripts/services-up.ps1 -Mode docker
#       （等价于 docker compose -f 此文件 --env-file tests/.env.test up -d）
name: trailsnap-test

services:
  postgres:
    image: pgvector/pgvector:pg18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: trailsnap
      POSTGRES_USER: trailsnap
      POSTGRES_PASSWORD: trailsnap
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${TS_DOCKER_PG_PORT:-5532}:5432"
    volumes:
      - trailsnap-test-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trailsnap -d trailsnap -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  server:
    image: siyuan044/trailsnap-server:master
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      DB_URL: postgresql://trailsnap:trailsnap@postgres:5432/trailsnap
      RAILWAY_DB_URL: postgresql://trailsnap:trailsnap@postgres:5432/railway
      AI_API_URL: http://ai:8001
      # 透传 runner 的 CI 标志进容器：server 据此对 OCR/VISUAL_DESCRIPTION 等任务限速
      # （CI 下最多处理 5 张照片）。本地 docker/dev 模式 CI 未设 → 不限制。
      CI: ${CI:-}
    ports:
      - "${TS_DOCKER_SERVER_PORT:-8800}:8000"
    volumes:
      - trailsnap-test-data:/app/data
      - ${TS_PHOTO_HOST_DIR:-../../tests/fixtures/e2e-photos}:${TS_PHOTO_DIR:-/testdata/photos}

  ai:
    image: siyuan044/trailsnap-ai:master
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MODEL_PATH: /app/data/models
      # e2e（尤其 full 套件）可能跑较久；关闭 idle 自杀，避免容器中途退出
      IDLE_TIMEOUT: 86400
    ports:
      - "${TS_DOCKER_AI_PORT:-8801}:8001"
    volumes:
      # 模型权重持久化到宿主机；CI 用 actions/cache 跨 run 缓存，避免每次重下数百 MB
      - ${TS_AI_MODEL_HOST_DIR:-../../tests/.cache/ai-models}:/app/data/models
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health-check || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

  frontend:
    image: siyuan044/trailsnap-frontend:master
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${TS_DOCKER_WEB_PORT:-8082}:80"

volumes:
  trailsnap-test-pg:
  trailsnap-test-data:
