version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: trailsnap
      POSTGRES_USER: trailsnap
      POSTGRES_PASSWORD: trailsnap
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5532:5432"
    volumes:
      - trailsnap-e2e-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trailsnap -d trailsnap -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  server:
    image: siyuan044/trailsnap-server:master
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      DB_URL: postgresql://trailsnap:trailsnap@postgres:5432/trailsnap
      RAILWAY_DB_URL: postgresql://trailsnap:trailsnap@postgres:5432/railway
      AI_API_URL: http://127.0.0.1:65535
    ports:
      - "8800:8000"
    volumes:
      - trailsnap-e2e-data:/app/data
      - ../../package/official-site/public/examples/images:/testdata/photos:ro

  frontend:
    image: siyuan044/trailsnap-frontend:master
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "8082:80"

volumes:
  trailsnap-e2e-pg:
  trailsnap-e2e-data:
