name: Build and Push Server

on:
  push:
    branches: [ "master" ]
    tags: [ "v*.*.*" ]
    paths:
      - 'package/server/**'
      - '.github/workflows/docker-build-push-server.yml'
  workflow_dispatch:
    inputs:
      push_latest:
        description: '同时打 latest 标签推送'
        required: false
        default: false
        type: boolean

jobs:
  build-and-push-server:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '构建后端') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Determine image tags
        id: set-tags
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          PUSH_LATEST: ${{ inputs.push_latest }}
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            BASE_TAG=${GITHUB_REF#refs/tags/v}
            EXTRA_TAGS="latest"
          else
            BASE_TAG=${GITHUB_REF#refs/heads/}
            EXTRA_TAGS=""
          fi

          if [[ "$COMMIT_MSG" == *"-latest"* ]]; then
            EXTRA_TAGS="latest"
          fi

          # 手动触发时按入参决定是否打 latest
          if [[ "$PUSH_LATEST" == "true" ]]; then
            EXTRA_TAGS="latest"
          fi

          echo "BASE_TAG=$BASE_TAG" >> $GITHUB_ENV
          echo "EXTRA_TAGS=$EXTRA_TAGS" >> $GITHUB_ENV
          echo "DOCKER_HUB_USERNAME=${{ secrets.DOCKER_HUB_USERNAME }}" >> $GITHUB_ENV

      - name: Build and push server
        uses: docker/build-push-action@v5
        with:
          context: ./package/server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKER_HUB_USERNAME }}/trailsnap-server:${{ env.BASE_TAG }}
            ${{ env.EXTRA_TAGS != '' && format('{0}/trailsnap-server:latest', env.DOCKER_HUB_USERNAME) || '' }}
