name: Build and Push Server

on:
  push:
    branches: [ "master" ]
    tags: [ "v*.*.*" ]
    paths:
      - 'package/server/**'
      - '.github/workflows/docker-build-push-server.yml'
  schedule:
    # 凌晨 4 点（北京时间，UTC+8）= UTC 20:00；每日构建并推送后端镜像
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      push_latest:
        description: '同时打 latest 标签推送'
        required: false
        default: false
        type: boolean

jobs:
  build-and-push-server:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      startsWith(github.ref, 'refs/tags/') ||
      contains(github.event.head_commit.message, '构建后端')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Determine image tags
        id: set-tags
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          PUSH_LATEST: ${{ inputs.push_latest }}
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            BASE_TAG=${GITHUB_REF#refs/tags/v}
            EXTRA_TAGS="latest"
          else
            BASE_TAG=${GITHUB_REF#refs/heads/}
            EXTRA_TAGS=""
          fi

          # Docker tag 不允许包含分支名中的 / 等字符。
          BASE_TAG=$(printf '%s' "$BASE_TAG" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g; s/^[.-]+//; s/[.-]+$//' | cut -c1-128)
          if [[ -z "$BASE_TAG" ]]; then
            BASE_TAG="sha-${GITHUB_SHA:0:12}"
          fi

          if [[ "$COMMIT_MSG" == *"-latest"* ]]; then
            EXTRA_TAGS="latest"
          fi

          # 手动触发时按入参决定是否打 latest
          if [[ "$PUSH_LATEST" == "true" ]]; then
            EXTRA_TAGS="latest"
          fi

          # 定时触发默认不带 latest（日常构建走 :master，便于回滚）
          echo "BASE_TAG=$BASE_TAG" >> $GITHUB_ENV
          echo "EXTRA_TAGS=$EXTRA_TAGS" >> $GITHUB_ENV
          echo "DOCKER_HUB_USERNAME=${{ secrets.DOCKER_HUB_USERNAME }}" >> $GITHUB_ENV

      - name: Build and push server
        uses: docker/build-push-action@v5
        with:
          context: ./package/server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKER_HUB_USERNAME }}/trailsnap-server:${{ env.BASE_TAG }}
            ${{ env.EXTRA_TAGS != '' && format('{0}/trailsnap-server:latest', env.DOCKER_HUB_USERNAME) || '' }}