name: Build and Push Server

on:
  pull_request:
    branches: [ "master" ]
    types: [opened, synchronize, reopened]
    paths:
      - 'package/server/**'
      - '.github/workflows/docker-build-push-server.yml'
      - '.github/scripts/mirror-server-image.sh'
  push:
    branches: [ "master" ]
    tags: [ "v*.*.*" ]
    paths:
      - 'package/server/**'
      - '.github/workflows/docker-build-push-server.yml'
      - '.github/scripts/mirror-server-image.sh'
  schedule:
    # 凌晨 4 点（北京时间，UTC+8）= UTC 20:00；每日构建并推送后端镜像
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      mirror_version:
        description: '仅补同步已发布版本到 ACR（例如 0.17.0），留空则正常构建'
        type: string
        required: false
      mirror_digest:
        description: '补同步的 Docker Hub 镜像 sha256 摘要，必须与 mirror_version 同时提供'
        type: string
        required: false

concurrency:
  group: server-image-${{ inputs.mirror_version || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-server:
    name: Build Server (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    if: |
      inputs.mirror_version == '' && inputs.mirror_digest == '' && (
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      startsWith(github.ref, 'refs/tags/') ||
      contains(github.event.head_commit.message, '构建后端'))
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # Compile FFmpeg on each native CPU rather than emulating ARM on x86.
      # Publish immutable digests; only the merge job updates the public tags.
      - name: Build and push platform digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./package/server
          platforms: linux/${{ matrix.arch }}
          provenance: false
          outputs: type=image,name=${{ secrets.DOCKER_HUB_USERNAME }}/trailsnap-server,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=server-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=server-${{ matrix.arch }}

      - name: Export platform digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo '::error::Invalid build digest'; exit 1; }
          mkdir -p "$RUNNER_TEMP/server-digests"
          touch "$RUNNER_TEMP/server-digests/${DIGEST#sha256:}"

      - name: Upload platform digest
        uses: actions/upload-artifact@v4
        with:
          name: server-digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/server-digests/*
          if-no-files-found: error
          retention-days: 1

  build-and-push-server:
    needs: build-server
    # Mirror recovery skips both native builds and uses the requested digest.
    # Ordinary builds publish a tag only after both platforms have succeeded.
    if: |
      always() && !cancelled() && (
      needs.build-server.result == 'success' ||
      (github.event_name == 'workflow_dispatch' && (inputs.mirror_version != '' || inputs.mirror_digest != '')))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Check ACR secrets
        id: acr_check
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          if [ -n "$ACR_REGISTRY" ] && [ -n "$ACR_NAMESPACE" ] && [ -n "$ACR_USERNAME" ] && [ -n "$ACR_PASSWORD" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "::notice::ACR secrets 配置不完整，本次仅推送 Docker Hub。"
          fi

      - name: Determine image tags
        id: set-tags
        env:
          MIRROR_VERSION: ${{ inputs.mirror_version }}
          MIRROR_DIGEST: ${{ inputs.mirror_digest }}
          ACR_ENABLED: ${{ steps.acr_check.outputs.enabled }}
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
        run: |
          set -euo pipefail
          if [[ -n "$MIRROR_VERSION" || -n "$MIRROR_DIGEST" ]]; then
            [[ "$MIRROR_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo '::error::Invalid mirror_version'; exit 1; }
            [[ "$MIRROR_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo '::error::Invalid mirror_digest'; exit 1; }
            [[ "$ACR_ENABLED" == true ]] || { echo '::error::ACR secrets are required for mirror recovery'; exit 1; }
            BASE_TAG="$MIRROR_VERSION"
            EXTRA_TAG="latest"
          elif [[ $GITHUB_REF == refs/tags/* ]]; then
            BASE_TAG=${GITHUB_REF#refs/tags/v}
            EXTRA_TAG="latest"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_TAG="preview"
            EXTRA_TAG=""
          else
            BASE_TAG=${GITHUB_REF#refs/heads/}
            EXTRA_TAG=""
          fi

          # Docker tag 不允许包含分支名中的 / 等字符。
          BASE_TAG=$(printf '%s' "$BASE_TAG" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g; s/^[.-]+//; s/[.-]+$//' | cut -c1-128)
          if [[ -z "$BASE_TAG" ]]; then
            BASE_TAG="sha-${GITHUB_SHA:0:12}"
          fi

          echo "BASE_TAG=$BASE_TAG" >> $GITHUB_ENV
          echo "EXTRA_TAG=$EXTRA_TAG" >> $GITHUB_ENV
          echo "DOCKER_HUB_USERNAME=$DOCKER_HUB_USERNAME" >> $GITHUB_ENV

      - name: Download platform digests
        if: inputs.mirror_version == '' && inputs.mirror_digest == ''
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/server-digests
          pattern: server-digests-*
          merge-multiple: true

      - name: Publish multi-platform server manifest
        id: build
        if: inputs.mirror_version == '' && inputs.mirror_digest == ''
        run: |
          set -euo pipefail
          IMAGE="${DOCKER_HUB_USERNAME}/trailsnap-server"
          mapfile -t digests < <(find "$RUNNER_TEMP/server-digests" -maxdepth 1 -type f -printf '%f\n' | sort)
          [[ ${#digests[@]} -eq 2 ]] || { echo '::error::Expected two platform digests'; exit 1; }
          refs=()
          for digest in "${digests[@]}"; do
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]] || { echo '::error::Invalid platform digest'; exit 1; }
            refs+=("${IMAGE}@sha256:${digest}")
          done
          tags=(-t "${IMAGE}:${BASE_TAG}")
          if [[ -n "$EXTRA_TAG" ]]; then tags+=(-t "${IMAGE}:${EXTRA_TAG}"); fi
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
          docker buildx imagetools inspect "${IMAGE}:${BASE_TAG}" --raw > "$RUNNER_TEMP/server-index.json"
          jq -e '[.manifests[].platform | .os + "/" + .architecture] | sort == ["linux/amd64", "linux/arm64"]' "$RUNNER_TEMP/server-index.json"
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${BASE_TAG}" --format '{{.Manifest.Digest}}')
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo '::error::Invalid manifest digest'; exit 1; }
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      # Copy the completed multi-platform image separately so ACR cannot stall
      # BuildKit's Docker Hub exporter. Pin the source to this build's digest.
      - name: Mirror server image to Aliyun ACR
        id: acr_mirror
        if: steps.acr_check.outputs.enabled == 'true'
        timeout-minutes: 70
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        env:
          IMAGE_DIGEST: ${{ inputs.mirror_digest || steps.build.outputs.digest }}
          MIRROR_ONLY: ${{ inputs.mirror_version != '' }}
          COPY_TIMEOUT_SECONDS: ${{ github.event_name == 'pull_request' && '180' || '1800' }}
          COPY_ATTEMPTS: ${{ github.event_name == 'pull_request' && '1' || '2' }}
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y skopeo

          bash .github/scripts/mirror-server-image.sh

      - name: Report preview mirror failure
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.acr_mirror.outcome == 'failure' }}
        run: echo '::warning::ACR preview mirror failed or timed out. Docker Hub publication succeeded. Non-PR builds require ACR synchronization to succeed.'
