name: Build and Push Server

on:
  pull_request:
    branches: [ "master" ]
    types: [opened, synchronize, reopened]
    paths:
      - 'package/server/**'
      - '.github/workflows/docker-build-push-server.yml'
  push:
    branches: [ "master" ]
    tags: [ "v*.*.*" ]
    paths:
      - 'package/server/**'
      - '.github/workflows/docker-build-push-server.yml'
  schedule:
    # 凌晨 4 点（北京时间，UTC+8）= UTC 20:00；每日构建并推送后端镜像
    - cron: '0 20 * * *'
  workflow_dispatch:

concurrency:
  group: server-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push-server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      startsWith(github.ref, 'refs/tags/') ||
      contains(github.event.head_commit.message, '构建后端')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Check ACR secrets
        id: acr_check
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          if [ -n "$ACR_REGISTRY" ] && [ -n "$ACR_NAMESPACE" ] && [ -n "$ACR_USERNAME" ] && [ -n "$ACR_PASSWORD" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "::notice::ACR secrets 配置不完整，本次仅推送 Docker Hub。"
          fi

      - name: Determine image tags
        id: set-tags
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            BASE_TAG=${GITHUB_REF#refs/tags/v}
            EXTRA_TAG="latest"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_TAG="preview"
            EXTRA_TAG=""
          else
            BASE_TAG=${GITHUB_REF#refs/heads/}
            EXTRA_TAG=""
          fi

          # Docker tag 不允许包含分支名中的 / 等字符。
          BASE_TAG=$(printf '%s' "$BASE_TAG" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g; s/^[.-]+//; s/[.-]+$//' | cut -c1-128)
          if [[ -z "$BASE_TAG" ]]; then
            BASE_TAG="sha-${GITHUB_SHA:0:12}"
          fi

          echo "BASE_TAG=$BASE_TAG" >> $GITHUB_ENV
          echo "EXTRA_TAG=$EXTRA_TAG" >> $GITHUB_ENV
          echo "DOCKER_HUB_USERNAME=${{ secrets.DOCKER_HUB_USERNAME }}" >> $GITHUB_ENV

      - name: Build and push server to Docker Hub
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./package/server
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.DOCKER_HUB_USERNAME }}/trailsnap-server:${{ env.BASE_TAG }}
            ${{ env.EXTRA_TAG != '' && format('{0}/trailsnap-server:{1}', env.DOCKER_HUB_USERNAME, env.EXTRA_TAG) || '' }}

      # Copy the completed multi-platform image separately so ACR cannot stall
      # BuildKit's Docker Hub exporter. Pin the source to this build's digest.
      - name: Mirror server image to Aliyun ACR
        id: acr_mirror
        if: steps.acr_check.outputs.enabled == 'true'
        timeout-minutes: 8
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y skopeo

          # Keep credentials off command-line arguments and reuse Docker Hub login.
          AUTH_FILE="${DOCKER_CONFIG:-$HOME/.docker}/config.json"
          printf '%s' "$ACR_PASSWORD" | timeout 30s skopeo login \
            --authfile "$AUTH_FILE" --username "$ACR_USERNAME" --password-stdin "$ACR_REGISTRY"

          SOURCE="docker://${DOCKER_HUB_USERNAME}/trailsnap-server@${IMAGE_DIGEST}"
          for TAG in "$BASE_TAG" "$EXTRA_TAG"; do
            [ -n "$TAG" ] || continue
            timeout 180s skopeo copy --all --preserve-digests --retry-times 2 \
              --authfile "$AUTH_FILE" "$SOURCE" \
              "docker://${ACR_REGISTRY}/${ACR_NAMESPACE}/trailsnap-server:${TAG}"
          done

      - name: Report preview mirror failure
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.acr_mirror.outcome == 'failure' }}
        run: echo '::warning::ACR preview mirror failed or timed out. Docker Hub publication succeeded. Non-PR builds require ACR synchronization to succeed.'
