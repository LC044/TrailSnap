name: Build and Push Server

on:
  pull_request:
    branches: [ "master" ]
    types: [opened, synchronize, reopened]
    paths:
      - 'package/server/**'
      - '.github/workflows/docker-build-push-server.yml'
  push:
    branches: [ "master" ]
    tags: [ "v*.*.*" ]
    paths:
      - 'package/server/**'
      - '.github/workflows/docker-build-push-server.yml'
  schedule:
    # 凌晨 4 点（北京时间，UTC+8）= UTC 20:00；每日构建并推送后端镜像
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  build-and-push-server:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      startsWith(github.ref, 'refs/tags/') ||
      contains(github.event.head_commit.message, '构建后端')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Determine image tags
        id: set-tags
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            BASE_TAG=${GITHUB_REF#refs/tags/v}
            EXTRA_TAG="latest"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_TAG="preview"
            EXTRA_TAG=""
          else
            BASE_TAG=${GITHUB_REF#refs/heads/}
            EXTRA_TAG=""
          fi

          # Docker tag 不允许包含分支名中的 / 等字符。
          BASE_TAG=$(printf '%s' "$BASE_TAG" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g; s/^[.-]+//; s/[.-]+$//' | cut -c1-128)
          if [[ -z "$BASE_TAG" ]]; then
            BASE_TAG="sha-${GITHUB_SHA:0:12}"
          fi

          echo "BASE_TAG=$BASE_TAG" >> $GITHUB_ENV
          echo "EXTRA_TAG=$EXTRA_TAG" >> $GITHUB_ENV
          echo "DOCKER_HUB_USERNAME=${{ secrets.DOCKER_HUB_USERNAME }}" >> $GITHUB_ENV

      - name: Build and push server
        uses: docker/build-push-action@v5
        with:
          context: ./package/server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKER_HUB_USERNAME }}/trailsnap-server:${{ env.BASE_TAG }}
            ${{ env.EXTRA_TAG != '' && format('{0}/trailsnap-server:{1}', env.DOCKER_HUB_USERNAME, env.EXTRA_TAG) || '' }}

  # ============ 同步多架构镜像到阿里云 ACR（国内加速拉取） ============
  # docker buildx imagetools create 把完整镜像（manifest list + 各平台 manifest + layer）
  # 从 Docker Hub 复制到阿里云 ACR，不重新构建，秒级完成。国内用户拉
  #   registry.cn-hangzhou.aliyuncs.com/<ACR_NAMESPACE>/trailsnap-server:<tag>
  # 走阿里云内网/CDN，远快于直连 Docker Hub。
  # 需仓库 secrets（未配置时本 job 自动跳过）：ACR_REGISTRY / ACR_NAMESPACE / ACR_USERNAME / ACR_PASSWORD。
  sync-to-cn:
    needs: build-and-push-server
    runs-on: ubuntu-latest
    if: ${{ needs.build-and-push-server.result == 'success' }}
    steps:
      - name: Check ACR secrets
        id: acr_check
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
        run: |
          if [ -z "$ACR_REGISTRY" ]; then
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "::notice::未配置 ACR_REGISTRY secret，跳过国内镜像同步。配置后见 sync-to-cn job 注释。"
          else
            echo "enabled=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.acr_check.outputs.enabled == 'true'
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Login to Docker Hub
        if: steps.acr_check.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Login to Aliyun ACR
        if: steps.acr_check.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # tag 计算逻辑与 build-and-push-server job 完全一致（含分支名 sanitize）
      - name: Determine image tags
        if: steps.acr_check.outputs.enabled == 'true'
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            BASE_TAG=${GITHUB_REF#refs/tags/v}
            EXTRA_TAG="latest"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_TAG="preview"
            EXTRA_TAG=""
          else
            BASE_TAG=${GITHUB_REF#refs/heads/}
            EXTRA_TAG=""
          fi

          BASE_TAG=$(printf '%s' "$BASE_TAG" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g; s/^[.-]+//; s/[.-]+$//' | cut -c1-128)
          if [[ -z "$BASE_TAG" ]]; then
            BASE_TAG="sha-${GITHUB_SHA:0:12}"
          fi

          echo "BASE_TAG=$BASE_TAG" >> $GITHUB_ENV
          echo "EXTRA_TAG=$EXTRA_TAG" >> $GITHUB_ENV
          echo "DOCKER_HUB_USERNAME=${{ secrets.DOCKER_HUB_USERNAME }}" >> $GITHUB_ENV

      # -t 指定目标，位置参数为源；imagetools create 拉取源完整内容并推送到目标 registry
      - name: Sync multi-arch images to Aliyun ACR
        if: steps.acr_check.outputs.enabled == 'true'
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
        run: |
          set -e
          SRC="${DOCKER_HUB_USERNAME}/trailsnap-server"
          DST="${ACR_REGISTRY}/${ACR_NAMESPACE}/trailsnap-server"

          TAGS="$BASE_TAG"
          [ -n "$EXTRA_TAG" ] && TAGS="$TAGS $EXTRA_TAG"
          for TAG in $TAGS; do
            echo "==> 同步 $SRC:$TAG -> $DST:$TAG"
            docker buildx imagetools create -t "$DST:$TAG" "$SRC:$TAG"
          done
