name: Build Desktop Installers

on:
  workflow_dispatch:
  pull_request:
    branches: [ "master" ]
    types: [opened, synchronize, reopened]
    paths:
      - 'package/desktop/**'
      - 'package/website/**'
      - 'package/server/**'
      - '.github/workflows/build-desktop.yml'
  push:
    branches: [ "master" ]
    tags: [ "v*.*.*" ]
    paths:
      - 'package/desktop/**'
      - 'package/website/**'
      - 'package/server/**'
      - '.github/workflows/build-desktop.yml'

concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/v') && format('desktop-release-{0}', github.ref_name) || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }} installer
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '构建桌面') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact: windows
            bundles: nsis
          - name: macOS
            os: macos-latest
            artifact: macos
            bundles: dmg
          - name: Linux
            os: ubuntu-latest
            artifact: linux
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      PYTHONUTF8: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: |
            package/website/pnpm-lock.yaml
            package/desktop/pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libfuse2 is required to run linuxdeploy / linuxdeploy-plugin-appimage
          # (both are AppImages) during AppImage bundling. ubuntu-latest (24.04)
          # no longer ships libfuse2 preinstalled, which makes Tauri abort with
          # "failed to run linuxdeploy".
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: package/server/uv.lock

      - name: Install frontend and desktop dependencies
        run: |
          pnpm --dir package/website install --frozen-lockfile
          pnpm --dir package/desktop install --frozen-lockfile

      - name: Build Vue frontend
        run: pnpm --dir package/website build

      - name: Install and compile FastAPI sidecar
        shell: bash
        working-directory: package/server
        run: |
          uv sync --frozen --group dev
          uv run python scripts/build_desktop_runtime.py

      - name: Stage sidecar for Tauri
        shell: bash
        run: |
          mkdir -p package/desktop/server-dist
          cp -R package/server/dist/trailsnap-server package/desktop/server-dist/trailsnap-server

      - name: Diagnose sidecar native libs (Linux only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -x
          echo "=== libgfortran in staged sidecar ==="
          find package/desktop/server-dist/trailsnap-server -iname "libgfortran*" || true
          echo "=== .libs dirs in staged sidecar ==="
          find package/desktop/server-dist/trailsnap-server -type d -iname "*.libs" || true
          echo "=== _dfitpack + its NEEDED libs ==="
          DFP=$(find package/desktop/server-dist/trailsnap-server -iname "_dfitpack*" | head -1)
          echo "_dfitpack: $DFP"
          [ -n "$DFP" ] && objdump -p "$DFP" | grep NEEDED || true
          echo "=== ldd on _dfitpack (shows unresolved) ==="
          [ -n "$DFP" ] && ldd "$DFP" || true
          echo "=== libmvec in staged sidecar ==="
          find package/desktop/server-dist/trailsnap-server -iname "libmvec*" || true
          echo "=== libx265 NEEDED + RPATH + UPX + ldd (staged sidecar) ==="
          X265=$(find package/desktop/server-dist/trailsnap-server -iname "libx265*" | head -1)
          echo "libx265: $X265"
          [ -n "$X265" ] && file "$X265" || true
          [ -n "$X265" ] && objdump -p "$X265" | grep -E 'NEEDED|RPATH|RUNPATH' || true
          [ -n "$X265" ] && echo "print-rpath: $(patchelf --print-rpath "$X265" 2>/dev/null)" || true
          [ -n "$X265" ] && ldd "$X265" || true
          echo "=== top-level hash libs flattened into _internal/ ==="
          find package/desktop/server-dist/trailsnap-server/_internal -maxdepth 1 -name 'lib*-*.so*' | head -40 || true

      - name: Ensure sidecar .libs RPATHs include $ORIGIN (Linux only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # linuxdeploy resolves every ELF's deps by calling `ldd` on the
          # canonical path (src/core/elf_file.cpp traceDynamicDependencies).
          # ldd expands $ORIGIN-relative RPATHs, so a hash lib inside
          # <pkg>.libs/ can find its sibling hash deps (e.g. libx265 ->
          # libmvec-<hash>.so, both in pillow_heif.libs/) ONLY if its RPATH
          # actually contains $ORIGIN. PyInstaller's relocate step (and UPX,
          # enabled in desktop_server.spec) can drop or rewrite the wheel's
          # $ORIGIN RPATH, after which ldd reports "=> not found" and
          # linuxdeploy aborts with "Could not find dependency".
          #
          # LD_LIBRARY_PATH is NOT a usable fallback: linuxdeploy is itself an
          # AppImage run via --appimage-extract-and-run, whose runtime overrides
          # LD_LIBRARY_PATH to its own extracted lib dir, and linuxdeploy does
          # not read EXTRA_LD_LIBRARY_PATH at all (confirmed in src/main.cpp:
          # only --exclude-library is supported, no env var). The only lever
          # that works inside ldd is the ELF's own RPATH, so prefix $ORIGIN
          # (preserving any existing RPATH) onto every .so inside *.libs/ dirs.
          find package/desktop/server-dist/trailsnap-server/_internal -type d -name '*.libs' | while read -r d; do
            for f in "$d"/*.so*; do
              [ -f "$f" ] || continue
              cur=$(patchelf --print-rpath "$f" 2>/dev/null || true)
              case ":$cur:" in
                *'$ORIGIN'*) : ;;  # already has $ORIGIN, leave alone
                *) patchelf --set-rpath "\$ORIGIN${cur:+:$cur}" "$f" 2>/dev/null || true ;;
              esac
            done
          done
          echo "Ensured \$ORIGIN in RPATH of .libs/ ELF files"

      - name: Build Tauri 2 installer
        # Invoke `tauri` directly via `pnpm exec` so `--bundles` is consumed by
        # the Tauri CLI. Using `pnpm build -- --bundles ...` forwards the `--`
        # separator into `tauri build -- --bundles ...`, which makes Tauri pass
        # `--bundles` down to `cargo build` (cargo rejects it; suggests --benches).
        #
        # On Linux, AppImage bundling runs linuxdeploy and
        # linuxdeploy-plugin-appimage, which are themselves AppImages. GitHub's
        # ubuntu-latest runner has no usable /dev/fuse even with libfuse2
        # installed, so those tools cannot mount themselves and Tauri aborts with
        # "failed to run linuxdeploy". APPIMAGE_EXTRACT_AND_RUN=1 makes AppImage
        # tools extract to a temp dir and run from there, sidestepping FUSE.
        env:
          APPIMAGE_EXTRACT_AND_RUN: ${{ runner.os == 'Linux' && '1' || '' }}
          # Tauri's bundler hides linuxdeploy stderr by default, leaving only a
          # generic "failed to run linuxdeploy". Surface the real error.
          TAURI_BUNDLER_VERBOSE: '1'
          LINUXDEPLOY_DEBUG: ${{ runner.os == 'Linux' && '1' || '' }}
        run: pnpm --dir package/desktop exec tauri build --verbose --bundles ${{ matrix.bundles }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrailSnap-${{ matrix.artifact }}-${{ github.run_number }}
          path: |
            package/desktop/src-tauri/target/release/bundle/nsis/*.exe
            package/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            package/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            package/desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14

  release:
    name: Add desktop installers to GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: TrailSnap-*
          path: artifacts
          merge-multiple: true

      - name: Collect desktop installers
        shell: bash
        run: |
          mkdir -p release-assets
          mapfile -d '' files < <(find artifacts -type f -print0)
          ((${#files[@]} > 0)) || { echo "::error::No desktop installers were downloaded"; exit 1; }
          for file in "${files[@]}"; do
            destination="release-assets/${file##*/}"
            [ ! -e "$destination" ] || { echo "::error::Duplicate installer name: ${file##*/}"; exit 1; }
            mv "$file" "$destination"
          done

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*.exe
            release-assets/*.dmg
            release-assets/*.AppImage
            release-assets/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  preview-release:
    name: Add desktop installers to PR preview release
    needs: build
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: pr-preview-release-assets
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: TrailSnap-*
          path: artifacts
          merge-multiple: true

      - name: Collect and prefix desktop installers
        shell: bash
        run: |
          mkdir -p release-assets
          mapfile -d '' files < <(find artifacts -type f -print0)
          ((${#files[@]} > 0)) || { echo "::error::No desktop installers were downloaded"; exit 1; }
          for file in "${files[@]}"; do
            destination="release-assets/TrailSnap-pr-${{ github.event.number }}-${file##*/}"
            [ ! -e "$destination" ] || { echo "::error::Duplicate installer name: ${file##*/}"; exit 1; }
            mv "$file" "$destination"
          done

      - name: Update shared PR preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pr-preview
          name: TrailSnap PR Previews
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          body: Shared test builds for open pull requests. Download assets matching the PR number. The Docker `preview` tag always points to the most recently completed internal PR build.
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
