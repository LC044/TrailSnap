name: Build Desktop Installers

on:
  workflow_dispatch:
  pull_request:
    branches: [ "master" ]
    paths:
      - 'package/desktop/**'
      - 'package/website/**'
      - 'package/server/**'
      - '.github/workflows/build-desktop.yml'
  push:
    branches: [ "master" ]
    tags: [ "v*.*.*" ]
    paths:
      - 'package/desktop/**'
      - 'package/website/**'
      - 'package/server/**'
      - '.github/workflows/build-desktop.yml'

concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/v') && format('desktop-release-{0}', github.ref_name) || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }} installer
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '构建桌面') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact: windows
            bundles: nsis
          - name: macOS
            os: macos-latest
            artifact: macos
            bundles: dmg
          - name: Linux
            os: ubuntu-latest
            artifact: linux
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      PYTHONUTF8: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: |
            package/website/pnpm-lock.yaml
            package/desktop/pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libfuse2 is required to run linuxdeploy / linuxdeploy-plugin-appimage
          # (both are AppImages) during AppImage bundling. ubuntu-latest (24.04)
          # no longer ships libfuse2 preinstalled, which makes Tauri abort with
          # "failed to run linuxdeploy".
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: package/server/uv.lock

      - name: Install frontend and desktop dependencies
        run: |
          pnpm --dir package/website install --frozen-lockfile
          pnpm --dir package/desktop install --frozen-lockfile

      - name: Build Vue frontend
        run: pnpm --dir package/website build

      - name: Install and compile FastAPI sidecar
        shell: bash
        working-directory: package/server
        run: |
          uv sync --frozen --group dev
          uv run python scripts/build_desktop_runtime.py

      - name: Stage sidecar for Tauri
        shell: bash
        run: |
          mkdir -p package/desktop/server-dist
          cp -R package/server/dist/trailsnap-server package/desktop/server-dist/trailsnap-server

      - name: Diagnose sidecar native libs (Linux only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -x
          echo "=== libgfortran in staged sidecar ==="
          find package/desktop/server-dist/trailsnap-server -iname "libgfortran*" || true
          echo "=== .libs dirs in staged sidecar ==="
          find package/desktop/server-dist/trailsnap-server -type d -iname "*.libs" || true
          echo "=== _dfitpack + its NEEDED libs ==="
          DFP=$(find package/desktop/server-dist/trailsnap-server -iname "_dfitpack*" | head -1)
          echo "_dfitpack: $DFP"
          [ -n "$DFP" ] && objdump -p "$DFP" | grep NEEDED || true
          echo "=== ldd on _dfitpack (shows unresolved) ==="
          [ -n "$DFP" ] && ldd "$DFP" || true
          echo "=== libmvec in staged sidecar ==="
          find package/desktop/server-dist/trailsnap-server -iname "libmvec*" || true
          echo "=== libx265 + its NEEDED libs ==="
          X265=$(find package/desktop/server-dist/trailsnap-server -iname "libx265*" | head -1)
          echo "libx265: $X265"
          [ -n "$X265" ] && objdump -p "$X265" | grep NEEDED || true
          echo "=== top-level hash libs flattened into _internal/ ==="
          find package/desktop/server-dist/trailsnap-server/_internal -maxdepth 1 -name 'lib*-*.so*' | head -40 || true

      - name: Expose sidecar vendored libs to linuxdeploy (Linux only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # PyInstaller scatters hash-suffixed vendored libraries
          # (libgfortran-<hash>.so, libmvec-<hash>.so, libx265-<hash>.so,
          # libscipy_openblas64_-<hash>.so, ...) across the _internal/ tree:
          # some live in <pkg>.libs/ subdirs, many are flattened to the
          # _internal/ top level. Extension modules locate them via
          # $ORIGIN-relative RUNPATHs, but linuxdeploy's $ORIGIN expansion is
          # unreliable across nested paths and it aborts with
          # "Could not find dependency: lib<name>-<hash>.so" the moment a
          # dependent ELF's $ORIGIN doesn't point at the dir holding the lib.
          # Expose EVERY directory under _internal/ via LD_LIBRARY_PATH so
          # linuxdeploy's ldd-based resolver has an absolute-path fallback
          # regardless of where PyInstaller placed each vendored lib.
          libs=$(find package/desktop/server-dist/trailsnap-server/_internal -type d -printf '%p:' 2>/dev/null)
          echo "LD_LIBRARY_PATH=${libs}${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          echo "Added $(find package/desktop/server-dist/trailsnap-server/_internal -type d | wc -l) dirs under _internal/ to LD_LIBRARY_PATH"

      - name: Build Tauri 2 installer
        # Invoke `tauri` directly via `pnpm exec` so `--bundles` is consumed by
        # the Tauri CLI. Using `pnpm build -- --bundles ...` forwards the `--`
        # separator into `tauri build -- --bundles ...`, which makes Tauri pass
        # `--bundles` down to `cargo build` (cargo rejects it; suggests --benches).
        #
        # On Linux, AppImage bundling runs linuxdeploy and
        # linuxdeploy-plugin-appimage, which are themselves AppImages. GitHub's
        # ubuntu-latest runner has no usable /dev/fuse even with libfuse2
        # installed, so those tools cannot mount themselves and Tauri aborts with
        # "failed to run linuxdeploy". APPIMAGE_EXTRACT_AND_RUN=1 makes AppImage
        # tools extract to a temp dir and run from there, sidestepping FUSE.
        env:
          APPIMAGE_EXTRACT_AND_RUN: ${{ runner.os == 'Linux' && '1' || '' }}
          # Tauri's bundler hides linuxdeploy stderr by default, leaving only a
          # generic "failed to run linuxdeploy". Surface the real error.
          TAURI_BUNDLER_VERBOSE: '1'
          LINUXDEPLOY_DEBUG: ${{ runner.os == 'Linux' && '1' || '' }}
        run: pnpm --dir package/desktop exec tauri build --verbose --bundles ${{ matrix.bundles }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrailSnap-${{ matrix.artifact }}-${{ github.run_number }}
          path: |
            package/desktop/src-tauri/target/release/bundle/nsis/*.exe
            package/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            package/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            package/desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14

  release:
    name: Add desktop installers to GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: TrailSnap-*
          path: artifacts
          merge-multiple: true

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/*.AppImage
            artifacts/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
