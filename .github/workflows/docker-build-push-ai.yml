name: Build and Push AI

on:
  pull_request:
    branches: [ "master" ]
    types: [opened, synchronize, reopened]
    paths:
      - 'package/ai/**'
      - '.github/workflows/docker-build-push-ai.yml'
  push:
    branches: [ "master" ]
    tags: [ "v*.*.*" ]
    paths:
      - 'package/ai/**'
      - '.github/workflows/docker-build-push-ai.yml'
  schedule:
    # 凌晨 4 点（北京时间，UTC+8）= UTC 20:00；每日构建并推送 AI 镜像（cpu/gpu/openvino）
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  build-and-push-ai:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      startsWith(github.ref, 'refs/tags/') ||
      contains(github.event.head_commit.message, '构建ai') ||
      contains(github.event.head_commit.message, '构建AI')
    strategy:
      matrix:
        include:
          - type: cpu
            dockerfile: Dockerfile
            platforms: linux/amd64,linux/arm64
            tag_suffix: "-cpu"
          - type: gpu
            dockerfile: Dockerfile.gpu
            platforms: linux/amd64
            tag_suffix: "-gpu"
          - type: openvino
            dockerfile: Dockerfile.openvino
            platforms: linux/amd64
            tag_suffix: "-openvino"
    # PR previews only build the CPU image; release/manual/scheduled builds keep the full matrix.
    steps:
      - name: Checkout code
        if: github.event_name != 'pull_request' || matrix.type == 'cpu'
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: github.event_name != 'pull_request' || matrix.type == 'cpu'
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request' || matrix.type == 'cpu'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Check ACR secrets
        if: github.event_name != 'pull_request' || matrix.type == 'cpu'
        id: acr_check
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          if [ -n "$ACR_REGISTRY" ] && [ -n "$ACR_NAMESPACE" ] && [ -n "$ACR_USERNAME" ] && [ -n "$ACR_PASSWORD" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "::notice::ACR secrets 配置不完整，本次仅推送 Docker Hub。"
          fi

      - name: Login to Aliyun ACR
        if: steps.acr_check.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Determine image tags
        if: github.event_name != 'pull_request' || matrix.type == 'cpu'
        id: set-tags
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            RAW_BASE_TAG=${GITHUB_REF#refs/tags/v}
            RAW_EXTRA_TAG="latest"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            RAW_BASE_TAG="preview"
            RAW_EXTRA_TAG=""
          else
            RAW_BASE_TAG=${GITHUB_REF#refs/heads/}
            RAW_EXTRA_TAG=""
          fi

          # Append suffix from matrix
          BASE_TAG="${RAW_BASE_TAG}${{ matrix.tag_suffix }}"

          echo "BASE_TAG=$BASE_TAG" >> $GITHUB_ENV
          echo "RAW_BASE_TAG=$RAW_BASE_TAG" >> $GITHUB_ENV
          echo "RAW_EXTRA_TAG=$RAW_EXTRA_TAG" >> $GITHUB_ENV
          echo "DOCKER_HUB_USERNAME=${{ secrets.DOCKER_HUB_USERNAME }}" >> $GITHUB_ENV

      - name: Build and push ai
        if: github.event_name != 'pull_request' || matrix.type == 'cpu'
        uses: docker/build-push-action@v5
        with:
          context: ./package/ai
          file: ./package/ai/${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          # ACR currently rejects BuildKit's OCI attestation manifest
          # (application/vnd.oci.empty.v1+json). Push the same plain image
          # manifest to both registries in one build instead.
          provenance: false
          tags: |
            ${{ github.event_name != 'pull_request' && format('{0}/trailsnap-ai:{1}', env.DOCKER_HUB_USERNAME, env.BASE_TAG) || '' }}
            ${{ matrix.type == 'cpu' && format('{0}/trailsnap-ai:{1}', env.DOCKER_HUB_USERNAME, env.RAW_BASE_TAG) || '' }}
            ${{ env.RAW_EXTRA_TAG != '' && format('{0}/trailsnap-ai:{1}{2}', env.DOCKER_HUB_USERNAME, env.RAW_EXTRA_TAG, matrix.tag_suffix) || '' }}
            ${{ matrix.type == 'cpu' && env.RAW_EXTRA_TAG != '' && format('{0}/trailsnap-ai:{1}', env.DOCKER_HUB_USERNAME, env.RAW_EXTRA_TAG) || '' }}
            ${{ steps.acr_check.outputs.enabled == 'true' && github.event_name != 'pull_request' && format('{0}/{1}/trailsnap-ai:{2}', secrets.ACR_REGISTRY, secrets.ACR_NAMESPACE, env.BASE_TAG) || '' }}
            ${{ steps.acr_check.outputs.enabled == 'true' && matrix.type == 'cpu' && format('{0}/{1}/trailsnap-ai:{2}', secrets.ACR_REGISTRY, secrets.ACR_NAMESPACE, env.RAW_BASE_TAG) || '' }}
            ${{ steps.acr_check.outputs.enabled == 'true' && env.RAW_EXTRA_TAG != '' && format('{0}/{1}/trailsnap-ai:{2}{3}', secrets.ACR_REGISTRY, secrets.ACR_NAMESPACE, env.RAW_EXTRA_TAG, matrix.tag_suffix) || '' }}
            ${{ steps.acr_check.outputs.enabled == 'true' && matrix.type == 'cpu' && env.RAW_EXTRA_TAG != '' && format('{0}/{1}/trailsnap-ai:{2}', secrets.ACR_REGISTRY, secrets.ACR_NAMESPACE, env.RAW_EXTRA_TAG) || '' }}
          cache-from: type=gha,scope=build-ai-${{ matrix.type }}
          cache-to: type=gha,mode=max,scope=build-ai-${{ matrix.type }}
