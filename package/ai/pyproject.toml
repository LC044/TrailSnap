[project]
name = "project"
version = "0.13.1"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110.0",
  "insightface>=0.7.3",
  "modelscope>=1.33.0",
  "numpy>=1.26.0",
  "opencv-python-headless>=4.9.0",
  "pillow>=12.3.0",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.0",
  "python-multipart>=0.0.26",
  "rapidocr>=3.9.0,<4",
  "uvicorn>=0.27.0",
  "httpx>=0.27.0",
  "transformers>=4.37.0"
]

[project.optional-dependencies]
cpu = [
  "onnxruntime>=1.23.2"
]

openvino = [
  "onnxruntime-openvino>=1.24.1",
  "openvino==2025.4.1"
]

gpu = [
  "onnxruntime-gpu>=1.23.2"
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
]
desktop = [
  "pyinstaller>=6.17.0",
  "psutil>=7.2.1",
]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "openvino" },
    { extra = "gpu" },
  ],
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
# 与 server 共用同一套 marker 语义，由 tests/scripts/run-tests.ps1 统一选择
markers = [
    "smoke: P0 关键路径，秒级",
    "regression: 常规回归用例（默认跑）",
    "slow: 耗时用例（>2s），默认跳过",
    "model: 需要加载 AI 模型/显存，默认跳过",
    "module_face: 人脸域",
    "module_ocr: OCR 域",
    "module_ticket: 票据域",
    "module_embedding: 向量/CLIP 域",
]

# 覆盖率配置。与 server 一致：不写进 addopts，需要时显式带 --cov：
#   uv run python -m pytest tests --cov=app --cov-branch --cov-report=term-missing --cov-report=xml:coverage.xml
[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "*/__pycache__/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
