[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trailsnap-cli"
version = "0.10.2"
description = "TrailSnap Command Line Interface"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.10.0",
    "responses>=0.23.0"
]

[project.scripts]
trailsnap = "trailsnap.cli:main"

[tool.setuptools]
packages = ["trailsnap", "trailsnap.commands"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "smoke: P0 关键路径，秒级"
]
