# =====================================================================
# http 层指令（本文件被 include 进 nginx.conf 的 http {} 块）
# =====================================================================

# 天地图瓦片资源缓存配置
proxy_cache_path /var/cache/nginx/tianditu levels=1:2 keys_zone=tianditu_cache:100m inactive=7d max_size=1g;

# ---- Gzip 压缩 ----
# 前端 entry JS/CSS 体积较大（未压缩数百 KB），开启 gzip 可省 70%+ 传输。
# gzip_proxied any：对后端 /api/ 的 JSON 响应也压缩；
# SSE 的 text/event-stream 不在 gzip_types 中，不受影响（流式聊天保持实时）。
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;
# 不压缩 image/jpeg/png/webp 与 font/woff2——它们已压缩，再 gzip 只浪费 CPU。

# 隐藏 nginx 版本号（安全）
server_tokens off;

# 静态文件元数据缓存（减少磁盘 IO）
open_file_cache max=1000 inactive=20s;
open_file_cache_valid 30s;
open_file_cache_min_uses 2;
open_file_cache_errors on;

server {
    listen 80;
    server_name localhost;
    charset utf-8;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1000M;

    # SPA 入口 HTML 必须每次回源：否则发版后用户仍拿到旧 HTML，
    # 进而引用旧 hash 的 JS/CSS，导致更新无法生效。
    # try_files 的末参 /index.html 会内部重定向到这里，故用精确匹配。
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 前端构建产物：文件名带 content hash，内容变更时文件名必变，
    # 可永久强缓存（immutable），二次访问直接走浏览器 disk cache，零请求。
    # 只用 add_header 设 Cache-Control，避免 expires 指令再追加一个同名头。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Keep the public API under the same origin as the web app. The exact
    # /api path is redirected so clients never fall through to the SPA.
    location = /api {
        return 308 /api/;
    }

    # 代理天地图瓦片请求并缓存
    location /tianditu-tiles/ {
        # 代理到天地图官方服务器，这里固定使用 t0 域名以简化缓存管理
        proxy_pass https://t0.tianditu.gov.cn/;

        # 启用缓存
        proxy_cache tianditu_cache;
        # 缓存 200 和 304 响应，有效期 7 天
        proxy_cache_valid 200 304 7d;
        # 缓存键：图层类型+x+y+层级（不包含 tk，因为 tk 是通用的）
        proxy_cache_key "$arg_T$arg_x$arg_y$arg_l";

        # 强制缓存，忽略天地图自身的缓存控制响应头
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Set-Cookie;

        # 代理请求头设置
        proxy_set_header Host t0.tianditu.gov.cn;
        proxy_ssl_server_name on;

        # 允许跨域
        add_header Access-Control-Allow-Origin *;
        # 在响应头中增加缓存状态，方便调试 (HIT/MISS/BYPASS)
        add_header X-Cache-Status $upstream_cache_status;

        # 错误处理：如果后端出错，尝试使用过期的缓存
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    }

    # 无鉴权的局域网服务标识。手机 App 使用宿主机已发布的统一端口探测，
    # 避免 Docker bridge 隔离 mDNS 组播时无法自动发现。
    location = /.well-known/trailsnap {
        proxy_pass http://server:8000/discovery;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    # 代理API请求到后端服务（注意：后端服务名在Docker Compose中定义为server）
    location /api/ {
        proxy_pass http://server:8000/;  # 后端容器的地址和端口
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /api;

        # 照片上传 / 大文件导出可能耗时，放宽超时
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # 透传 SSE / 流式响应（Agent 流式聊天、任务进度推送）：
        # 关闭缓冲，避免 nginx 攒满响应体才下发，导致流式不实时。
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
