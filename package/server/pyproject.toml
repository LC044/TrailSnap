[project]
name = "server"
version = "0.8.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp>=3.13.4",
    "aiosqlite==0.21.0",
    "alembic>=1.17.2",
    "apscheduler>=3.11.1",
    "fastapi>=0.122.0",
    "openai>=2.14.0",
    "opencv-python-headless>=4.12.0.88",
    "pgvector>=0.4.2",
    "piexif>=1.1.3",
    "pillow>=12.3.0",
    "pillow-heif>=1.1.1",
    "psycopg2-binary>=2.9.11",
    "pydantic>=2.12.4",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.27",
    "requests>=2.32.5",
    "reverse-geocoder>=1.5.1",
    "scikit-learn>=1.7.2",
    "sqlalchemy>=2.0.44",
    "uvicorn>=0.38.0",
    "python-jose[cryptography]>=3.3.0",
    "pydantic[email]>=2.0.0",
    "bcrypt==4.0.1",
    "passlib==1.7.4",
    "ollama>=0.6.1",
    "langchain>=0.3.10",
    "langchain-openai>=0.2.14",
    "langchain-community>=0.3.10",
    "langgraph>=0.2.61",
    "sse-starlette>=2.1.3",
    "psutil>=6.1.0",
]
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
# 统一 marker 体系：覆盖度(smoke/regression/slow) × 资源(postgres/model) × 模块(module_*)
# 由 tests/scripts/run-tests.ps1 通过 -m 选择，变量集中在 tests/.env.test
markers = [
    "smoke: P0 关键路径，秒级",
    "regression: 常规回归用例（默认跑）",
    "slow: 耗时用例（>2s），默认跳过",
    "postgres: 需要真实 pgvector，默认跳过",
    "model: 需要加载 AI 模型/显存，默认跳过",
    "module_photo: 照片域",
    "module_album: 相册域",
    "module_user: 用户与认证域",
    "module_face: 人脸域",
    "module_ocr: OCR 域",
    "module_ticket: 票据域",
    "module_search: 搜索域",
    "module_agent: Agent 域",
    "module_toolbox: 工具箱域",
    "module_system: 系统域 (config/version/update-check)",
    "module_classification: 智能分类域",
]
