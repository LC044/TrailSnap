[project]
name = "trailsnap-requirement-platform"
version = "0.1.0"
description = "TrailSnap requirement intake, triage and release batch management"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.17.2",
  "bcrypt==4.0.1",
  "fastapi>=0.122.0",
  "httpx>=0.28.1",
  "mcp>=1.14.0",
  "passlib[bcrypt]>=1.7.4",
  "pydantic[email]>=2.12.4",
  "python-jose[cryptography]>=3.3.0",
  "python-multipart>=0.0.27",
  "sqlalchemy>=2.0.44",
  "uvicorn>=0.38.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["requirement_platform"]
